# ============================================================================
# Compute environment
# ============================================================================
compute:
  platform: "Local Windows Workstation (Intel CPU)"
  cpu_cores: 8
  ram_gb: 16
  python_version: "3.12"
  os: "Windows 11"
  uses_gpu_for_inference: false
  has_network_during_ranking: false
  pre_computation_required: true
  pre_computation_time_minutes: 18  # Time taken to embed all 100K candidates offline on CPU

# ============================================================================
# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Gemini"
  - "Claude"

ai_usage_summary: |
  Used Gemini (Antigravity) and Claude for code refactoring, styling, architecture design, and creating presentation assets. No candidate data was sent to any external APIs during ranking.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Hybrid pipeline combining structured feature extraction, local semantic matching (all-MiniLM-L6-v2 cached), override penalties (neutralizing keyword stuffers, honeypots, research-only, and services-only), and a multiplicative behavioral boost. Achieves NDCG@100 of 0.965 and Precision@100 of 95% on local verification sets, running in under 3.5 seconds on CPU.

# ============================================================================
# Declarations
# ============================================================================
declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
